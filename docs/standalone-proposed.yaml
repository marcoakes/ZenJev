# Proposed only: install in ZenJev only after the owner selects the separate
# trusted-local route described by ASTRA_MASTER_BUILD.md section 5.
# Test/script paths below are implementation targets, not existing/passed tests.
version: 1
execution:
  backend: local
evidence:
  include: []
  redact:
    env: ['*TOKEN*', '*SECRET*', '*KEY*', '*PASSWORD*']
gates:
  - id: branding
    run: node scripts/check-branding.mjs public/branding/zenjev-hero.png README.md package.json
    timeout: 30
    proves: [branding-identity, branding-original, branding-readme]
  - id: workflow-security
    run: npm exec --offline -- vitest run --config vitest.config.ts tests/workflow.test.ts tests/security.test.ts tests/approval.test.ts
    timeout: 120
    proves: [workflow, mode-isolation, privacy, approval-integrity]
  - id: provider-contracts
    run: npm exec --offline -- vitest run --config vitest.config.ts tests/jev-contract.test.ts tests/github-contract.test.ts tests/zendesk-contract.test.ts
    timeout: 120
    proves: [jev-contract, provider-contracts, candidate-bounds]
  - id: persistence-recovery
    run: npm exec --offline -- vitest run --config vitest.config.ts tests/postgres.test.ts tests/worker-recovery.test.ts tests/webhooks.test.ts
    timeout: 180
    proves: [durability, webhook-security, reconciliation]
  - id: evaluation
    run: npm exec --offline -- vitest run --config vitest.config.ts tests/evaluation.test.ts tests/context-boundary.test.ts
    timeout: 120
    proves: [evaluation-integrity, honest-metrics]
  - id: browser
    run: npm exec --offline -- playwright test --config playwright.config.ts tests/browser/workbench.spec.ts tests/browser/modes.spec.ts tests/browser/branding.spec.ts
    timeout: 300
    proves: [browser-workflow, browser-accessibility]
    artifacts:
      max_bytes: 5242880
      total_bytes: 52428800
  - id: lint
    run: npm run lint
    timeout: 120
  - id: typecheck
    run: npm run typecheck
    timeout: 120
  - id: production-build
    run: npm run build
    timeout: 300
